<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>

  <body>
    <header style="--header-bg: url({{page.header}}); --header-color: {{page.color}};">
      {% include nav.html %}
      <div class="hero small">
        <h1>{{page.title}}</h1>
        <p>{{page.describe}}</p>
      </div>
    </header>

    {% include share.html format="inline" %}

    <main>
      <h2>{{page.title}}</h2>
      <p>{{page.describe}}</p>
      <section class="art">
        <article class="artwork">
          <div class="image"><img src="{{page.image}}" alt=""></div>
          <div class="title">{{page.title}}</div>
          <div class="date">{{page.date | date: "%B %d, %Y"}}</div>
        </article>
        <article class="content">
          {{content}}
        </article>
      </section>
    </main>

    {% include footer.html %}
  </body>
</html>
